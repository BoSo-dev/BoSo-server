name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.1"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run python scripts/check.py

  postgres:
    name: PostgreSQL and Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: boso
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: boso_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U boso -d boso_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://boso:ci-only-password@localhost:5432/boso_test
      TEST_DATABASE_URL: postgresql+psycopg://boso:ci-only-password@localhost:5432/boso_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.1"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest tests/test_database.py
      - run: docker compose config --quiet
      - run: docker build -t boso:ci .
      - name: Verify container liveness
        shell: bash
        run: |
          docker run -d --name boso-smoke -p 127.0.0.1:8000:8000 boso:ci
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health/live; then exit 0; fi
            sleep 1
          done
          docker logs boso-smoke
          exit 1
      - name: Clean up smoke container
        if: always()
        run: docker rm -f boso-smoke || true
