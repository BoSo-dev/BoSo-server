[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "boso-server"
version = "0.1.0"
description = "BoSo transport policy, personal tasks, and policy assistance backend"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.121,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.36,<2.1",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx2>=2.13,<3", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
